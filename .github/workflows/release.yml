name: Release

on:
  push:
    branches: [main]
    # Only changes to the shipped binary trigger a release — not docs or CI config.
    # Cargo.lock counts: the formula builds with --locked, so dependency bumps ship.
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      # MAJOR.MINOR comes from Cargo.toml; the patch is the run number, so
      # every release-worthy push to main gets a new, increasing version.
      - name: Compute version
        run: |
          BASE=$(sed -nE 's/^version = "([0-9]+\.[0-9]+)\..*"/\1/p' Cargo.toml | head -1)
          echo "VERSION=${BASE}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "claude-code-manager ${VERSION}" \
            --generate-notes

      - name: Hash source tarball
        id: meta
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(curl -fsSL "${URL}" | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
      SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: sanjayginde/homebrew-tap
          # Fine-grained PAT with Contents: read & write on sanjayginde/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump formula
        id: bump
        run: |
          # Re-runs of an older tag must not roll the formula back to a stale version
          CURRENT=$(sed -nE 's|^  url ".*/refs/tags/v(.*)\.tar\.gz"|\1|p' Formula/claude-code-manager.rb)
          NEWEST=$(printf '%s\n%s\n' "${CURRENT}" "${VERSION}" | sort -V | tail -1)
          if [ "${VERSION}" == "${CURRENT}" ] || [ "${NEWEST}" != "${VERSION}" ]; then
            echo "::notice::Formula is at ${CURRENT}; skipping ${VERSION}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i -E \
            -e "s|^  url \"(.*)/refs/tags/v.*\.tar\.gz\"|  url \"\1/refs/tags/v${VERSION}.tar.gz\"|" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" \
            Formula/claude-code-manager.rb
          git diff

      - name: Push
        if: steps.bump.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "claude-code-manager ${VERSION}"
          git push
